# Ruff settings for the Python in this repo (forge-release, forge-tracker, term-recorder,
# worktree-tidy and scripts/).
line-length = 100
# Their READMEs promise python3 3.9 or newer.
target-version = "py39"
# Extensionless Python entry points.
extend-include = [
  "plugins/forge-release/skills/forge-release/scripts/github-app-create",
  "plugins/forge-tracker/skills/forge-tracker/scripts/forge-tracker",
  "plugins/term-recorder/skills/term-recorder/scripts/term-record",
  "plugins/worktree-tidy/skills/worktree-tidy/scripts/worktree-tidy",
]

[lint]
# `X | None` fails at runtime before 3.10 without `from __future__ import annotations`.
ignore = ["UP045"]
