# Ruff settings for the Python in this repo (forge-release and forge-tracker).
line-length = 100
# forge-release's and forge-tracker's READMEs promise python3 3.9 or newer.
target-version = "py39"
# Extensionless Python entry points.
extend-include = [
  "plugins/forge-release/scripts/github-app-create",
  "plugins/forge-tracker/scripts/forge-tracker",
]

[lint]
# `X | None` fails at runtime before 3.10 without `from __future__ import annotations`.
ignore = ["UP045"]
