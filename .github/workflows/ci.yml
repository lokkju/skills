name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # validate runs without an Anthropic login or API key.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate marketplace and plugins
        run: |
          claude --version
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done

  # The plugin's tests on the oldest Claude Code it claims (MIN_CLAUDE_CODE in
  # hooks/version.ts) and on the current release; neither needs a login.
  session-decisions:
    name: session-decisions (Claude Code ${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        claude-code: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        env:
          WANT: ${{ matrix.claude-code }}
        run: |
          version="$WANT"
          if [ "$version" = minimum ]; then
            version=$(sed -n "s/^export const MIN_CLAUDE_CODE = '\([0-9.]*\)'$/\1/p" plugins/session-decisions/hooks/version.ts)
            [ -n "$version" ] || { echo "no MIN_CLAUDE_CODE in hooks/version.ts" >&2; exit 1; }
          fi
          npm install -g "@anthropic-ai/claude-code@$version"
          claude --version
      - name: Test session-decisions
        run: claude plugin test plugins/session-decisions

  # The OpenCode entry (package.json, harness/opencode/): its tests load it with a
  # fake config under Node's own test runner; no OpenCode install or model needed.
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tests
        run: npm test
      - name: Package contents
        run: |
          files=$(npm pack --dry-run --json | jq -r '.[0].files[].path')
          printf '%s\n' "$files"
          grep -qx 'harness/opencode/index.js' <<<"$files"
          grep -qx 'plugins/forge-tracker/commands/next.md' <<<"$files"
          ! grep -q -e '/tests/' -e '\.claude-plugin/' -e '/hooks/' <<<"$files"

  python:
    name: ${{ matrix.plugin }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [forge-release, forge-tracker, term-recorder, worktree-tidy]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # term-recorder's tests drive real tmux sessions.
      - name: Install tmux
        if: matrix.plugin == 'term-recorder'
        run: command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Ruff
        run: |
          uvx ruff check "plugins/$PLUGIN"
          uvx ruff format --check "plugins/$PLUGIN"
        env:
          PLUGIN: ${{ matrix.plugin }}
      - name: Tests
        run: uv run --no-project --with pytest pytest "plugins/$PLUGIN/tests"
        env:
          PLUGIN: ${{ matrix.plugin }}

  # Repo scripts outside any plugin (delegation-stats and its tests).
  scripts:
    name: scripts (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Ruff
        run: |
          uvx ruff check scripts
          uvx ruff format --check scripts
      - name: Tests
        run: uv run --no-project --with pytest pytest scripts/tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # Same shellcheck as .pre-commit-config.yaml; ubuntu-latest ships 0.9.0, which
      # flags optional function arguments (SC2120) that 0.11 accepts. Checks *.sh
      # plus any tracked file with an sh or bash shebang.
      - name: ShellCheck
        env:
          SHELLCHECK_PY: "0.11.0.1"
        run: |
          shellcheck() { uvx --from "shellcheck-py==$SHELLCHECK_PY" shellcheck "$@"; }
          shellcheck --version
          files=()
          while IFS= read -r -d '' f; do
            if [[ "$f" == *.sh ]] || head -n1 "$f" | grep -Eq '^#!.*[/ ](ba)?sh([[:space:]]|$)'; then
              files+=("$f")
            fi
          done < <(git ls-files -z)
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  skill-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Skill names match their directories
        run: uv run --no-project scripts/check-skill-names.py
