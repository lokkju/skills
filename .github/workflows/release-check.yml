name: release-check

# A PR that changes what a plugin ships must either release it (a feat, fix
# or perf title) or say it shouldn't (the no-release label). See
# .github/scripts/release-check.sh. edited, labeled and unlabeled re-run it
# when the title or labels change.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq (mikefarah), jq and gh come with the ubuntu-latest image.
      - name: Check the title releases or the PR is labeled no-release
        run: .github/scripts/release-check.sh
        env:
          GH_TOKEN: ${{ github.token }}
